<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>代码评审</title>
    <link rel="stylesheet" href="/app.css?panel=18" />
  </head>
  <body>
    <header class="top">
      <div class="project-switch">
        <label class="muted" for="repo-select">工程</label>
        <select id="repo-select"></select>
        <input id="repo-path" type="text" placeholder="登记路径" spellcheck="false" />
        <button type="button" id="pick-repo">选择</button>
        <button type="button" id="register-repo">登记</button>
      </div>
      <div>
        <strong id="repo-name">代码评审</strong>
        <div class="work-branches">
          <span class="muted">需求分支</span>
          <strong id="requirement-branch">未建立</strong>
          <span class="muted">开发分支</span>
          <strong id="development-branch">未建立</strong>
          <button type="button" id="claim-branch" hidden>认领</button>
          <span class="muted">合并目标</span>
          <strong id="merge-target">未绑定</strong>
        </div>
        <p id="unclaimed-note" class="unclaimed-note" hidden></p>
      </div>
      <span id="gate-label" class="state"></span>
      <form id="bugfix-entry" class="bugfix-entry">
        <input id="bugfix-purpose" type="text" placeholder="bugfix 需求" spellcheck="false" />
        <button type="submit" id="bugfix-open">跳过门禁</button>
      </form>
      <div class="top-actions">
        <button type="button" data-scope="slice">本段</button>
        <button type="button" data-scope="branch">分支</button>
        <button type="button" id="install">安装门禁</button>
      </div>
    </header>
    <p id="notice" class="notice" hidden></p>
    <section class="summary">
      <p id="meta" class="muted"></p>
      <h1 id="purpose">等待 Agent 登记这一小段的作用。</h1>
      <p id="phase-label" class="phase-label" hidden></p>
      <p id="round-label" class="round-label" hidden></p>
      <div id="decision-wrap">
        <p class="kicker">结论</p>
        <div id="decisions" class="row"></div>
      </div>
      <p id="banner" class="banner" hidden></p>
    </section>
    <div class="workspace">
      <aside id="files"></aside>
      <section class="diff-pane">
        <div id="file-head" class="file-head">
          <div id="file-path"></div>
          <p id="file-summary" class="file-summary" hidden></p>
        </div>
        <div id="viewbar"></div>
        <div id="locations"></div>
        <div id="diff"></div>
        <div id="comment" class="comment" hidden>
          <p id="comment-selection" class="kicker"></p>
          <div id="comment-thread"></div>
          <textarea id="comment-text" rows="3" placeholder="写下对这段代码的评论。"></textarea>
          <button type="button" id="comment-send">评论</button>
        </div>
        <pre id="source" class="source" hidden></pre>
      </section>
    </div>
    <section class="history">
      <h2>会话</h2>
      <div id="sessions"></div>
      <h2>工作记录</h2>
      <table>
        <thead>
          <tr><th>时间</th><th>作用说明</th><th>结果</th></tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
      <div id="history-pager" class="row"></div>
    </section>
    <p id="error" class="error" hidden></p>
    <script>/*__BOOT__*/</script>
    <script type="module" src="/app.js?panel=19"></script>
  </body>
</html>
